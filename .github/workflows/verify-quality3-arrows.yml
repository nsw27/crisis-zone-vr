name: Verify visible Preview 3 page buttons
on:
  push:
    branches: [feat/quest-quality-3]
    paths: [.github/workflows/verify-quality3-arrows.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact visually reviewed patch
        run: |
          echo '98262fba23176a72e1453cdb252290640a08ebf77957e181c5e1bc38a54c52d8  .review/visible-arrows.patch' | sha256sum -c -
          git apply --check .review/visible-arrows.patch
          git apply .review/visible-arrows.patch
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc libegl-dev libgles-dev libsdl2-dev libopenxr-dev libegl-mesa0 libgl1-mesa-dri
      - name: Repeat full controls and rendering checks
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          git show 858bb993fd07cc36e3e19decfca49281da2ba17d:quest/tc2_gl.c > /tmp/p1-gl.c
          git show 858bb993fd07cc36e3e19decfca49281da2ba17d:upstream/tc2/src/tc2_render.c > /tmp/p1-model.c
          git show 26485c0e765103fe7db7a7d5fa3deea438e34771:quest/tc2_gl.c > /tmp/p2-gl.c
          mkdir -p build/candidate-tests build/quality-tests
          python3 tests/test_quest_candidate.py --baseline-renderer /tmp/p1-gl.c --baseline-model /tmp/p1-model.c 2>&1 | tee build/candidate-tests/test.log
          python3 tests/test_quest_quality.py --baseline-renderer /tmp/p2-gl.c 2>&1 | tee build/quality-tests/test.log
      - name: Commit validated button fix only
        run: |
          git config user.name 'Thatcher productions'
          git config user.email '45753033+nsw27@users.noreply.github.com'
          git add quest/quest_ui.c tests/quest_candidate_graphics_fixture.c
          git rm .review/visible-arrows.patch .github/workflows/verify-quality3-arrows.yml
          git diff --cached --check
          git commit -m 'Draw visible pointer page arrows independently of missing font glyphs; test actual button pixels'
          git push origin HEAD:refs/heads/feat/quest-quality-3
          git rev-parse HEAD > quality-source-commit.txt
      - name: Preserve final source and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-quality3-final-validation
          path: |
            quality-source-commit.txt
            build/candidate-tests/results.json
            build/candidate-tests/test.log
            build/candidate-tests/*.ppm
            build/quality-tests/results.json
            build/quality-tests/test.log
          if-no-files-found: warn
          retention-days: 14
