name: Verify Enhanced arcade-colour assets
on:
  push:
    branches: [feat/quest-weapons-4]
    paths: [.github/workflows/validate-arcade-colours.yml]
permissions:
  contents: write
concurrency:
  group: enhanced-arcade-assets
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact reviewed tools and integrate runtime changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          expected={'tools/build_arcade_weapons.py':'a8f14e85687c1b2e4e19ed9954372e5acaf3115de82bde5e6e9322d2a6ef80b9','tests/test_arcade_weapons.py':'b83548ff5bd7500844c79ac4739f287ce09618a4b9c59195e62862c496a3edcd','tests/quest_arcade_asset_fixture.c':'e282b5d9b63d51a5be01dcb06260e4312d5f9fd314b16e701a1182cf1c907d5f','quest/quest_weapon_colours.h':'a7581a886087650b054a00c26622af87bdab3b33992752c433d905a29fa34911'}
          for name,sha in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
          data=json.loads(Path('.review/arcade-assets-integration.json').read_text())
          assert data['base']=='16601831b2a21bf7a46076c76bb30a37a8af68b8'
          pending=[]
          for item in data['changes']:
              p=Path(item['path']);assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0]=='quest' or str(p)=='NOTICE.md'
              old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==item['old'],str(p)
              lines=old.decode().splitlines(keepends=True)
              for a,b,text in reversed(item['edits']):lines[a:b]=text.splitlines(keepends=True)
              new=''.join(lines).encode();assert hashlib.sha256(new).hexdigest()==item['new'],str(p)
              pending.append((p,new))
          assert len(pending)==5
          for p,b in pending:p.write_bytes(b)
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc cmake ninja-build unzip wget libegl-dev libgles-dev libsdl2-dev libopenxr-dev libegl-mesa0 libgl1-mesa-dri
      - name: Generate exact assets and test production rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p build/arcade-assets
          python3 tools/build_arcade_weapons.py > build/arcade-assets/generation.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for name,sha in {'arcade-machine-gun':'e6e29e17b16597ebaa30e4578af54786286914db55fd13713d6871b627285fb6','arcade-shotgun':'1301ee2f6e52ece0a87c05558efa64b5be7b3ef075035a5b87ea910001313196'}.items():
              assert hashlib.sha256(Path('quest/assets/models',name+'.tcgun').read_bytes()).hexdigest()==sha,name
          PY
          python3 tests/test_arcade_weapons.py 2>&1 | tee build/arcade-assets/render.log
          python3 tests/test_quest_candidate.py --out build/arcade-regression 2>&1 | tee build/arcade-assets/regression.log
          python3 tests/test_weapon_hooks.py 2>&1 | tee build/arcade-assets/weapon-hooks.log
      - name: Compile changed ARM64 production objects
        run: |
          set -euo pipefail
          mkdir -p .tools/sdl .tools/openxr
          wget -q -O /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d .tools
          mv .tools/android-ndk-r29 .tools/ndk
          grep -q '29.0.14206865' .tools/ndk/source.properties
          rm /tmp/ndk.zip
          wget -q -O /tmp/sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.zip
          unzip -q /tmp/sdl.zip -d .tools/sdl
          wget -q -O /tmp/xr.aar https://repo.maven.apache.org/maven2/org/khronos/openxr/openxr_loader_for_android/1.1.43/openxr_loader_for_android-1.1.43.aar
          unzip -q /tmp/xr.aar -d .tools/openxr
          cmake -S quest -B build/native -G Ninja -DTC2_CORE_ONLY=ON -DCMAKE_TOOLCHAIN_FILE="$PWD/.tools/ndk/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release > build/arcade-assets/configure.log 2>&1
          python3 - <<'PY' 2>&1 | tee build/arcade-assets/android.log
          import subprocess
          wanted={'quest_gun.c','quest_host.c','quest_ui.c'}
          lines=subprocess.check_output(['ninja','-C','build/native','-t','targets','all'],text=True).splitlines()
          selected=[s.split(': ',1)[0] for s in lines if 'crisiszone_core.dir/' in s and any(s.split(': ',1)[0].endswith('/'+n+'.o') for n in wanted)]
          assert len(selected)==len(wanted),selected
          subprocess.run(['ninja','-C','build/native','-j','2',*selected],check=True)
          PY
      - name: Commit generated models and verified integration on working branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/quest-weapons-4 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Thatcher productions'
          git config user.email '45753033+nsw27@users.noreply.github.com'
          git add quest NOTICE.md
          git rm .review/arcade-assets-integration.json .github/workflows/validate-arcade-colours.yml
          git diff --cached --check
          git commit -m 'Use turquoise cabinet-style machine gun and pink handgun; prepare orange shotgun prop'
          git push origin HEAD:feat/quest-weapons-4
          git rev-parse HEAD > build/arcade-assets/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enhanced-arcade-colour-validation
          path: |
            build/arcade-assets/*.json
            build/arcade-assets/*.log
            build/arcade-assets/*.txt
            build/arcade-assets/*.ppm
            build/arcade-regression/*.json
            build/arcade-regression/*.ppm
          if-no-files-found: warn
          retention-days: 14
