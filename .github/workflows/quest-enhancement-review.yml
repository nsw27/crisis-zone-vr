name: Quest enhancement source review
on:
  push:
    branches: [feat/quest-enhancements-2]
    paths: [.github/workflows/quest-enhancement-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive staged source transport only
        shell: bash
        run: |
          set -euo pipefail
          tar -czf transport-review.tar.gz .review
          sha256sum transport-review.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: quest-transport-review
          path: transport-review.tar.gz
          if-no-files-found: error
          retention-days: 2
