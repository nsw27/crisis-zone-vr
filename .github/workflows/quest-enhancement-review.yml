name: Validate Quest enhancements against working Preview 1
on:
  push:
    branches: [feat/quest-enhancements-2]
    paths: [.github/workflows/quest-enhancement-review.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quest-enhancements-source-validation
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quest-enhancements-2
          fetch-depth: 0
      - name: Preserve source transfer for integrity audit
        run: tar -czf transport-review.tar.gz .review
      - name: Apply only exact checksum-verified source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          parts=[Path(f'.review/enhancements-{i}.b64').read_text().strip() for i in range(5)]
          # Correct two transcription defects in transport 0, before any source is read.
          assert hashlib.sha256(parts[0].encode()).hexdigest()=='e5650f03434638c94f38ba143ca0a07cb1b80bd50919919f94be273ae608d47a'
          s=parts[0];s=s[:11634]+s[11764:];s=s[:270]+'OP'+s[270:];parts[0]=s
          parts[2]=parts[2].replace('RTVttTEWKiaKafjn7nS4r','RTVttTEWKiafjn7nS4r')
          data=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(data).hexdigest()=='2874b9f33a9e8b4bd314a9727c6f7d1bd97d06119a927b3754f7cd47c636b324', 'Source transport digest mismatch'
          payload=json.loads(gzip.decompress(data));assert payload['base']=='cfa8b4b096171ab001c0e3637194f8d950ed9440'
          pending=[]
          for item in payload['changes']:
              p=Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in ('quest','tests','docs') or str(p)=='upstream/tc2/src/tc2_render.c'
              old=p.read_bytes() if p.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if p.exists() else None)==item['old'], str(p)
              lines=old.decode('utf-8').splitlines(keepends=True)
              for start,end,text in reversed(item['edits']):lines[start:end]=text.splitlines(keepends=True)
              result=''.join(lines).encode('utf-8');assert hashlib.sha256(result).hexdigest()==item['new'],str(p)
              pending.append((p,result))
          for p,result in pending:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          Path('enhancement-source-manifest.json').write_text(json.dumps({str(p):hashlib.sha256(b).hexdigest() for p,b in pending},indent=2)+'\n')
          print('Validated and applied',len(pending),'exact source files.')
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build unzip wget gcc libegl-dev libgles-dev libsdl2-dev libopenxr-dev libegl-mesa0 libgl1-mesa-dri
      - name: Run real source, input and GLES comparisons
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          git show 858bb993fd07cc36e3e19decfca49281da2ba17d:quest/tc2_gl.c > /tmp/preview1-gl.c
          git show 858bb993fd07cc36e3e19decfca49281da2ba17d:upstream/tc2/src/tc2_render.c > /tmp/preview1-model.c
          mkdir -p build/candidate-tests
          python3 tests/test_quest_candidate.py --baseline-renderer /tmp/preview1-gl.c --baseline-model /tmp/preview1-model.c 2>&1 | tee build/candidate-tests/test.log
      - name: Prepare exact Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/sdl .tools/openxr
          wget -q -O /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d .tools
          mv .tools/android-ndk-r29 .tools/ndk
          grep -q '29.0.14206865' .tools/ndk/source.properties
          rm /tmp/ndk.zip
          wget -q -O /tmp/sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.zip
          unzip -q /tmp/sdl.zip -d .tools/sdl
          wget -q -O /tmp/xr.aar https://repo.maven.apache.org/maven2/org/khronos/openxr/openxr_loader_for_android/1.1.43/openxr_loader_for_android-1.1.43.aar
          unzip -q /tmp/xr.aar -d .tools/openxr
      - name: Compile changed Android production objects (no ROM or APK)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S quest -B build/native -G Ninja -DTC2_CORE_ONLY=ON -DCMAKE_TOOLCHAIN_FILE="$PWD/.tools/ndk/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build/android-configure.log
          python3 - <<'PY' 2>&1 | tee build/android-objects.log
          import subprocess
          wanted={'quest_host.c','tc2_gl.c','tc2_scene.c','quest_ui.c','quest_options.c','tc2_render.c'}
          output=subprocess.check_output(['ninja','-C','build/native','-t','targets','all'],text=True)
          selected=[]
          for line in output.splitlines():
              target=line.split(': ',1)[0]
              if 'crisiszone_core.dir/' in target and any(target.endswith('/'+n+'.o') for n in wanted):selected.append(target)
          assert len(selected)==len(wanted),selected
          subprocess.run(['ninja','-C','build/native','-j','2',*selected],check=True)
          print('PASS: all six changed production translation units compiled for ARM64 Android NDK r29.')
          PY
      - name: Commit validated enhancement sources only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Thatcher productions'
          git config user.email '45753033+nsw27@users.noreply.github.com'
          git add quest tests docs upstream/tc2/src/tc2_render.c
          git rm .review/enhancements-*.b64
          git rm .github/workflows/quest-enhancement-review.yml
          git diff --cached --check
          git commit -m 'Enhance Quest rendering efficiency, two-hand handling, accessibility and measured diagnostics'
          git push origin HEAD:feat/quest-enhancements-2
          git rev-parse HEAD | tee enhancement-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quest-enhancements-validation
          path: |
            transport-review.tar.gz
            enhancement-source-manifest.json
            enhancement-commit.txt
            build/candidate-tests/results.json
            build/candidate-tests/test.log
            build/candidate-tests/*.ppm
            build/android-configure.log
            build/android-objects.log
          if-no-files-found: warn
          retention-days: 14
