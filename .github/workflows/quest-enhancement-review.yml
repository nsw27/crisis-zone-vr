name: Quest enhancement source review
on:
  push:
    branches: [feat/quest-enhancements-2]
    paths: [.github/workflows/quest-enhancement-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked review source only (no APK or core build)
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=quest-enhancement-source.tar.gz HEAD
          sha256sum quest-enhancement-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: quest-enhancement-source
          path: quest-enhancement-source.tar.gz
          if-no-files-found: error
          retention-days: 7
