name: Verify optional Enhanced goggle border
on:
  push:
    branches: [feat/quest-weapons-4]
    paths: [.github/workflows/validate-goggle-border.yml]
permissions:
  contents: write
concurrency:
  group: enhanced-goggle-border
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only locally validated sources
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          expected={'quest/quest_goggle_border.inc':'f49a87413b994d8017bc6a0371e2a0deb177bafbb2a3180e7e97b3667bb75c06','tests/quest_goggle_fixture.c':'eafb87ad8fac17a9706d8a775f73cf3794ffcacb087bd9c2797c61d74766f7aa'}
          for p,sha in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,p
          data=json.loads(Path('.review/goggle-border-integration.json').read_text())
          assert data['base']=='50a1748d7325df624a0d3f27c351bd14acc07f19'
          pending=[]
          for item in data['changes']:
              p=Path(item['path']);assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ('quest','tests','docs')
              old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==item['old'],str(p)
              lines=old.decode().splitlines(keepends=True)
              for a,b,s in reversed(item['edits']):lines[a:b]=s.splitlines(keepends=True)
              new=''.join(lines).encode();assert hashlib.sha256(new).hexdigest()==item['new'],str(p)
              pending.append((p,new))
          assert len(pending)==10
          for p,b in pending:p.write_bytes(b)
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc cmake ninja-build unzip wget libegl-dev libgles-dev libsdl2-dev libopenxr-dev libegl-mesa0 libgl1-mesa-dri
      - name: Test complete controls, optional border and real weapon assets
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p build/goggle-check
          python3 tests/test_quest_candidate.py --out build/goggle-check 2>&1 | tee build/goggle-check/regression.log
          python3 tests/test_weapon_hooks.py 2>&1 | tee build/goggle-check/hooks.log
          python3 tests/test_arcade_weapons.py 2>&1 | tee build/goggle-check/assets.log
      - name: Compile affected ARM64 production objects
        run: |
          set -euo pipefail
          mkdir -p .tools/sdl .tools/openxr
          wget -q -O /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d .tools
          mv .tools/android-ndk-r29 .tools/ndk
          grep -q '29.0.14206865' .tools/ndk/source.properties
          rm /tmp/ndk.zip
          wget -q -O /tmp/sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.zip
          unzip -q /tmp/sdl.zip -d .tools/sdl
          wget -q -O /tmp/xr.aar https://repo.maven.apache.org/maven2/org/khronos/openxr/openxr_loader_for_android/1.1.43/openxr_loader_for_android-1.1.43.aar
          unzip -q /tmp/xr.aar -d .tools/openxr
          cmake -S quest -B build/native -G Ninja -DTC2_CORE_ONLY=ON -DCMAKE_TOOLCHAIN_FILE="$PWD/.tools/ndk/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release > build/goggle-check/configure.log 2>&1
          python3 - <<'PY' 2>&1 | tee build/goggle-check/android.log
          import subprocess
          wanted={'quest_host.c','quest_ui.c','quest_options.c'}
          targets=subprocess.check_output(['ninja','-C','build/native','-t','targets','all'],text=True)
          selected=[x.split(': ',1)[0] for x in targets.splitlines() if 'crisiszone_core.dir/' in x and any(x.split(': ',1)[0].endswith('/'+n+'.o') for n in wanted)]
          assert len(selected)==len(wanted),selected
          subprocess.run(['ninja','-C','build/native','-j','2',*selected],check=True)
          PY
      - name: Commit validated presentation without rebuilding APK
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/quest-weapons-4 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Thatcher productions'
          git config user.email '45753033+nsw27@users.noreply.github.com'
          git add quest tests docs
          git rm .review/goggle-border-integration.json .github/workflows/validate-goggle-border.yml
          git diff --cached --check
          git commit -m 'Add optional stereo-aware soft fade and tactical goggles without changing aim or shield'
          git push origin HEAD:feat/quest-weapons-4
          git rev-parse HEAD > build/goggle-check/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enhanced-goggle-verification
          path: |
            build/goggle-check/*.json
            build/goggle-check/*.log
            build/goggle-check/*.txt
            build/goggle-check/*.ppm
            build/arcade-assets/results.json
          if-no-files-found: warn
          retention-days: 14
