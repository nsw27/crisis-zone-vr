name: Verify final renderer cleanup
on:
  push:
    branches: [feat/quest-preview-1]
    paths: [.github/workflows/finish-preview-renderer.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Remove precisely identified legacy renderer hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('upstream/tc2/src/tc2_render.c')
          raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='a7d8d18b6fd294a01e0556ddeb7d43b9ede42d3e'
          s=raw.decode()
          start=s.index('      /* Experimental VR pre-activation:')
          end=s.index('      if (lim > 0 && (all || p->blend))',start)
          s=s[:start]+s[end:]
          start=s.index('    /* Fade in newly appeared models (8 frames). */')
          end=s.index('    return 1;',start)
          s=s[:start]+s[end:]
          old='    extern int qvr_model_fade_frames(int model);\n    int fade = qvr_model_fade_frames(e->model);\n'
          assert s.count(old)==1
          s=s.replace(old,'')
          assert 'qvr_model_fade_frames' not in s and 'qvr_wide_fov_enabled' not in s
          p.write_text(s)
          t=Path('tests/test_quest_candidate.py');s=t.read_text()
          anchor="test('scene',['tests/crisis_zone_scene_fixture.c','quest/tc2_scene.c'])"
          assert s.count(anchor)==1
          s=s.replace(anchor,"test('world-renderer',['tests/quest_world_renderer_fixture.c'],links=['-pthread'])\n"+anchor)
          t.write_text(s)
          PY
          git diff --check
      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc libegl-dev libgles-dev libsdl2-dev libopenxr-dev libegl-mesa0 libgl1-mesa-dri
      - name: Run full regression suite including actual upstream builder
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p build/candidate-tests
          python3 tests/test_quest_candidate.py 2>&1 | tee build/candidate-tests/test.log
      - name: Commit verified renderer correction
        shell: bash
        run: |
          git add upstream/tc2/src/tc2_render.c tests/test_quest_candidate.py
          git -c user.name='Thatcher preview build' -c user.email='45753033+nsw27@users.noreply.github.com' commit -m 'Remove legacy fade callbacks and fake culling override; test real world renderer'
          git push origin HEAD:feat/quest-preview-1
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-preview-regression-evidence
          path: |
            build/candidate-tests/results.json
            build/candidate-tests/test.log
            build/candidate-tests/*.ppm
          if-no-files-found: warn
          retention-days: 14
