name: Native Quest core

# Builds the ROM-independent static core (libcrisiszone_core.a).
# This archive does NOT contain csz_sub.c / csz_io.c.
# It is NOT a playable libmain.so. The previous stubbed libmain-so artifact
# was a validation build only and must not be packaged.
#
# Stage B (local, with the user's ROM):
#   1. Generate real csz_sub.c and csz_io.c from the ROM.
#   2. Compile those two files with the SAME NDK used here.
#   3. Link them with this archive into the production libmain.so.
#   4. Package and sign the APK.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: Build crisiszone_core
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Memory and disk diagnostics
        run: |
          echo "=== free ==="
          free -h
          echo "=== nproc ==="
          nproc
          echo "=== df ==="
          df -h

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip wget

      - name: Download Android NDK r29 (Linux)
        run: |
          mkdir -p .tools
          # Match the project's normal NDK major (29.x). Stage B must use this same NDK.
          wget -q -O /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d .tools
          # The zip extracts to android-ndk-r29 or android-ndk-r29-*.
          NDK_DIR=$(find .tools -maxdepth 1 -type d -name 'android-ndk-*' | head -1)
          mv "$NDK_DIR" .tools/ndk
          echo "=== NDK source.properties ==="
          cat .tools/ndk/source.properties
          grep -q '29.0.14206865' .tools/ndk/source.properties || { echo "NDK revision mismatch"; exit 1; }
          rm /tmp/ndk.zip

      - name: Download SDL 2.30.11
        run: |
          wget -q -O /tmp/sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.zip
          unzip -q /tmp/sdl.zip -d .tools/sdl
          rm /tmp/sdl.zip

      - name: Download OpenXR loader AAR
        run: |
          wget -q -O /tmp/openxr.aar https://repo.maven.apache.org/maven2/org/khronos/openxr/openxr_loader_for_android/1.1.43/openxr_loader_for_android-1.1.43.aar
          mkdir -p .tools/openxr
          unzip -q /tmp/openxr.aar -d .tools/openxr
          rm /tmp/openxr.aar

      - name: Configure (core only, no H8)
        run: |
          mkdir -p build/native
          # TC2_CORE_ONLY skips libmain.so. No stub H8 is compiled or linked.
          cmake -Wno-dev -Wno-deprecated \
            -S quest -B build/native -G Ninja \
            -DTC2_CORE_ONLY=ON \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.tools/ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee build/cmake-configure.log

      - name: Build crisiszone_core (serial)
        run: |
          cmake --build build/native --target crisiszone_core --parallel 1 2>&1 | tee build/ninja-build.log
          ls -lh build/native/libcrisiszone_core.a

      - name: Upload crisiszone-precompiled-core
        uses: actions/upload-artifact@v4
        with:
          name: crisiszone-precompiled-core
          path: build/native/libcrisiszone_core.a
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/cmake-configure.log
            build/ninja-build.log
          if-no-files-found: ignore
